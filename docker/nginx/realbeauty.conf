# Real Beauty CRM — nginx in front of the React SPA + gunicorn API.
#
# TLS: a Let's Encrypt cert for the sslip.io hostname that resolves to this
# server's IP (169-58-58-145.sslip.io). Issued over the ACME webroot below and
# renewed by the `certbot` compose service. Bootstrap once with
# docker/nginx/init-letsencrypt.sh.

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_comp_level 5;
gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

# ---------------------------------------------------------------------------
# :80 — ACME challenge + redirect everything else to the canonical HTTPS host.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://169-58-58-145.sslip.io$request_uri;
    }
}

# ---------------------------------------------------------------------------
# :443 — the real site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name 169-58-58-145.sslip.io 169.58.58.145;

    ssl_certificate /etc/letsencrypt/live/169-58-58-145.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/169-58-58-145.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;  # tutorial videos are uploaded through the admin

    # Progress-photo thumbnails, product images, tutorial videos.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django admin's own static files (Unfold CSS/JS, etc).
    location /static/ {
        alias /srv/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Telegram Mini App (self-contained WebApp shell + assets).
    location /webapp/ {
        alias /srv/frontend/webapp/;
        try_files $uri $uri/ /webapp/index.html;
    }

    # The old Unfold admin UI.
    location /admin/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The React SPA's DRF backend + the Mini App's public endpoints.
    location /api/v1/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff-only proxy to originals that live on Telegram's servers.
    location /tg-file/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The React SPA's own JS/CSS bundle.
    location /assets/ {
        alias /srv/frontend/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the SPA shell. index.html must never be cached — it
    # points at content-hashed /assets bundles, so a stale shell is exactly how
    # a freshly deployed panel keeps serving the old JS to returning users.
    location / {
        root /srv/frontend;
        try_files $uri /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
